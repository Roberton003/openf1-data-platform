name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs for the same branch/PR to save CI resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linting — fast feedback on code style and static analysis
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-lint-

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort

      - name: Code Formatting Check (Black)
        run: black --check src/ tests/

      - name: Import Sorting Check (Isort)
        run: isort --check-only --profile black src/ tests/

      - name: Static Analysis & Lint (Flake8)
        run: |
          flake8 src/ tests/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E501,W291,F841,F541 \
            --exclude=src/dashboard/

  # ---------------------------------------------------------------------------
  # Security — dependency vulnerability audit
  # ---------------------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Run pip-audit on requirements.txt
        run: pip-audit -r requirements.txt --strict

      - name: Trivy vulnerability scan (Docker image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ---------------------------------------------------------------------------
  # Tests — unit + integration + SQL injection tests
  # ---------------------------------------------------------------------------
  test:
    name: Test Suite (65+ tests)
    runs-on: ubuntu-latest
    needs: lint # Only run tests if lint passes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-test-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Setup Data Directories
        run: |
          mkdir -p data/bronze data/silver data/gold data/quarantine

      - name: Run Test Suite with Coverage
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          PYTHONPATH=. python -m pytest tests/ -v \
            --tb=short \
            --cov=src/web \
            --cov-report=term-missing \
            --cov-fail-under=50

      - name: Verify Python Compilation
        run: |
          python -m py_compile src/web/main.py
          python -m py_compile src/web/database.py
          python -m py_compile src/web/health.py
          python -m py_compile src/web/logging.py
          python -m py_compile src/web/routers/analytics.py
          python -m py_compile src/web/routers/race_intelligence.py

  # ---------------------------------------------------------------------------
  # Docker Build — validate Dockerfile.api correctness (no push)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: openf1-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test API Container
        run: |
          # Start the container in background
          docker run -d --name openf1-api-smoke \
            -p 8001:8001 \
            -v ${{ github.workspace }}/data:/app/data:ro \
            openf1-api:ci-test

          # Wait for the container to be ready
          echo "Waiting for API to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:8001/api/health > /dev/null 2>&1; then
              echo "API is ready!"
              break
            fi
            sleep 1
          done

          # Verify health endpoint
          echo "=== Health Check ==="
          curl -sf http://localhost:8001/api/health
          echo ""

          # Verify sessions endpoint
          echo "=== Sessions Endpoint ==="
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8001/api/sessions

          # Cleanup
          docker stop openf1-api-smoke
          docker rm openf1-api-smoke
        continue-on-error: true # Don't fail CI if data is missing
