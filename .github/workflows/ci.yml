name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dagster.txt

    - name: Lint with black, isort and flake8
      run: |
        black --check src/ tests/
        isort --check-only src/ tests/
        flake8 src/ tests/

    - name: Run runtime tests
      run: |
        python -m pytest \
          tests/test_web_routers_sla.py \
          tests/test_web_routers_ci_alerts.py \
          tests/test_orchestration_schedule.py \
          tests/test_orchestration_sensor.py \
          tests/test_assets_coverage_gaps.py \
          -v
