name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-lint-

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Code Formatting (Black)
        run: black --check src/ tests/

      - name: Import Sorting (Isort)
        run: isort --check-only --profile black src/ tests/

      - name: Static Analysis (Flake8)
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503,E501,W291,F841,F541 --exclude=src/dashboard/

  test:
    name: Test Suite
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-test-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Setup data directories
        run: mkdir -p data/bronze data/silver data/gold data/quarantine

      - name: Run tests
        run: .venv/bin/python3 -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .
