name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-lint-

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint (Ruff)
        run: ruff check src/ tests/

      - name: Format Check (Ruff)
        run: ruff format src/ tests/ --check

  test:
    name: Test Suite
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-test-

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Setup data directories
        run: mkdir -p data/bronze data/silver data/gold data/quarantine

      - name: Run tests with coverage
        run: .venv/bin/python3 -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=60
        env:
          PYTHONPATH: .

  security:
    name: Security Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install bandit safety detect-secrets
      - name: Verify Agent/Skill Support
        run: python3 scripts/verify_agent_support.py
      - name: Bandit
        run: bandit -r src/ -f json -o bandit-report.json || true
      - name: Safety
        run: safety check -r requirements.txt --output json || true

  auto-heal:
    name: Auto-Heal Coverage
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage pytest-cov
      - name: Setup data directories
        run: mkdir -p data/bronze data/silver data/gold data/quarantine
      - name: Run auto-heal
        run: python scripts/auto_heal_cov.py --target 60 --max 5
        env:
          PYTHONPATH: .
      - name: Create PR if changes generated
        if: success()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="auto-heal/coverage-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "$BRANCH"
            git add -A
            git config user.name "openf1-auto-heal[bot]"
            git config user.email "openf1-auto-heal@users.noreply.github.com"
            git commit -m "test: auto-heal coverage gaps"
            git push origin "$BRANCH"
            gh pr create \
              --title "test: auto-heal coverage gaps" \
              --body "Geração automática de testes para módulos abaixo de 60% de cobertura. Revisar antes de merge." \
              --head "$BRANCH" || true
          else
            echo "No changes generated by auto-heal."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: .
