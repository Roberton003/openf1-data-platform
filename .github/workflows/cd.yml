name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - master
      - main

# Only one deployment at a time
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build & Push Docker image with version tag
  # ---------------------------------------------------------------------------
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    # Only deploy if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_sha: ${{ steps.meta.outputs.image_sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          IMAGE_TAG="${TIMESTAMP}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "Building image tag: ${IMAGE_TAG}"

      # Check if we have GHCR (GitHub Container Registry) configured.
      # If not, skip the push and rely on SSH-based deploy to build on target.
      - name: Log in to GitHub Container Registry
        if: env.REGISTRY_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: env.REGISTRY_PASSWORD != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openf1-api:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/openf1-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally (fallback — no registry)
        if: env.REGISTRY_PASSWORD == ''
        run: |
          docker build -t openf1-api:${{ steps.meta.outputs.image_tag }} -f Dockerfile.api .
        env:
          REGISTRY_PASSWORD: ""

  # ---------------------------------------------------------------------------
  # Deploy to production server via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-image
    environment: production # Protect with environment rules in GitHub settings

    steps:
      - name: Check for SSH secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SSH secrets configured. Skipping deployment."
          fi

      # -----------------------------------------------------------------------
      # Deploy with rollback on failure
      # -----------------------------------------------------------------------
      - name: Deploy via SSH with rollback
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build-image.outputs.image_tag }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_TAG
          script_stop: true # Stop on first error
          script: |
            set -euo pipefail

            DEPLOY_DIR="${DEPLOY_DIR:-/opt/openf1-data-platform}"
            cd "${DEPLOY_DIR}"

            echo "=== Deployment started: image tag ${IMAGE_TAG} ==="

            # -----------------------------------------------------------------------
            # Step 1: Save current state for rollback
            # -----------------------------------------------------------------------
            BACKUP_TAG="rollback-$(date +%Y%m%d-%H%M%S)"
            echo "Creating rollback backup: ${BACKUP_TAG}"

            # Tag the current running image for rollback
            CURRENT_IMAGE=$(docker ps --filter "name=openf1_api" --format "{{.Image}}" 2>/dev/null || echo "")
            if [ -n "${CURRENT_IMAGE}" ]; then
              docker tag "${CURRENT_IMAGE}" "openf1-api:${BACKUP_TAG}" || true
              echo "Backup tagged: openf1-api:${BACKUP_TAG}"
            fi

            # Save current docker-compose state
            if [ -f docker-compose.yml ]; then
              cp docker-compose.yml "docker-compose.yml.${BACKUP_TAG}"
            fi

            # -----------------------------------------------------------------------
            # Step 2: Pull latest code
            # -----------------------------------------------------------------------
            echo "=== Pulling latest code ==="
            git fetch origin
            git reset --hard origin/${{ github.event.workflow_run.head_branch }}

            # -----------------------------------------------------------------------
            # Step 3: Rebuild and restart
            # -----------------------------------------------------------------------
            echo "=== Rebuilding API container ==="
            docker-compose build api 2>&1 | tail -5

            echo "=== Restarting services ==="
            docker-compose up -d --no-deps --build api

            # -----------------------------------------------------------------------
            # Step 4: Smoke test — verify the deployment is healthy
            # -----------------------------------------------------------------------
            echo "=== Smoke testing deployment ==="
            SMOKE_PASSED=false
            for i in {1..30}; do
              if curl -sf -m 5 http://localhost:8001/api/health > /dev/null 2>&1; then
                echo "Health check passed (attempt ${i}/30)"
                SMOKE_PASSED=true
                break
              fi
              echo "Waiting for API... (attempt ${i}/30)"
              sleep 2
            done

            if [ "${SMOKE_PASSED}" != "true" ]; then
              echo "::error::Smoke test failed — rolling back!"

              # Rollback: restore previous docker-compose.yml and restart backup image
              if [ -f "docker-compose.yml.${BACKUP_TAG}" ]; then
                cp "docker-compose.yml.${BACKUP_TAG}" docker-compose.yml
              fi

              if [ -n "${CURRENT_IMAGE}" ]; then
                docker-compose up -d --no-deps api
              fi

              exit 1
            fi

            # -----------------------------------------------------------------------
            # Step 5: Verify API endpoints
            # -----------------------------------------------------------------------
            echo "=== Verifying critical endpoints ==="

            # Check sessions endpoint (may return empty list)
            SESSIONS_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8001/api/sessions || echo "000")
            if [ "${SESSIONS_CODE}" = "000" ]; then
              echo "::warning::/api/sessions returned error"
            else
              echo "/api/sessions: HTTP ${SESSIONS_CODE}"
            fi

            # Check Race Intelligence home page
            HOME_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8001/ || echo "000")
            if [ "${HOME_CODE}" = "000" ]; then
              echo "::warning::Homepage returned error"
            else
              echo "/: HTTP ${HOME_CODE}"
            fi

            echo "=== Deployment completed successfully ==="
            echo "Image tag: ${IMAGE_TAG}"

            # -----------------------------------------------------------------------
            # Step 6: Cleanup old rollback backups (keep last 3)
            # -----------------------------------------------------------------------
            ls -1 docker-compose.yml.rollback-* 2>/dev/null | head -n -3 | xargs -r rm

            # Prune dangling Docker images
            docker image prune -f 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Post-deploy: Notify (optional Slack/Discord webhook)
  # ---------------------------------------------------------------------------
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Notify deployment status
        run: |
          echo "Deployment status: ${{ needs.deploy.result }}"
          echo "Image tag: ${{ needs.build-image.outputs.image_tag }}"
          echo "Commit: ${{ needs.build-image.outputs.image_sha }}"
          # TODO: Add Slack/Discord webhook notification
