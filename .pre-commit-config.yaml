repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: .*/tests/.*|.*\.md$|.*\.github/workflows/.*
  - repo: local
    hooks:
      - id: verify-agent-support
        name: Verify Agent/Skill Support
        entry: python scripts/verify_agent_support.py
        language: system
        files: '\.(md|py|yaml|yml)$'
        pass_filenames: false
